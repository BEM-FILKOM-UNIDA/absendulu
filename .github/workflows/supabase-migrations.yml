name: Apply Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY to run migrations against the production database
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply production migrations
    if: ${{ inputs.confirm == 'APPLY' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.33.9

      - name: Preview pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
