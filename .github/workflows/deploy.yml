name: Deploy production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@41.7.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Run application checks
        run: npm run check

      - name: Build Vercel artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --location --max-time 30 "$PRODUCTION_URL/" >/dev/null
          curl --fail --silent --show-error --location --max-time 30 "$PRODUCTION_URL/login" >/dev/null
